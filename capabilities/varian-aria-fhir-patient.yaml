naftiko: 1.0.0-alpha2
info:
  label: Varian ARIA FHIR API — Patient
  description: 'Varian ARIA FHIR API — Patient. 2 operations. Lead operation: Search Patients. Self-contained Naftiko capability
    covering one Varian Medical Systems business surface.'
  tags:
  - Varian Medical Systems
  - Patient
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    VARIAN_MEDICAL_SYSTEMS_API_KEY: VARIAN_MEDICAL_SYSTEMS_API_KEY
capability:
  consumes:
  - type: http
    namespace: varian-aria-fhir-patient
    baseUri: https://varian.dynamicfhir.com/fhir/varian/basepractice/r4
    description: Varian ARIA FHIR API — Patient business capability. Self-contained, no shared references.
    resources:
    - name: Patient
      path: /Patient
      operations:
      - name: searchpatients
        method: GET
        description: Search Patients
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: _id
          in: query
          type: string
          description: Patient FHIR resource ID
        - name: identifier
          in: query
          type: string
          description: Patient identifier (e.g., MRN)
        - name: family
          in: query
          type: string
          description: Patient family (last) name
        - name: given
          in: query
          type: string
          description: Patient given (first) name
        - name: birthdate
          in: query
          type: string
          description: Patient birth date (YYYY-MM-DD)
        - name: _count
          in: query
          type: integer
          description: Maximum number of results to return
    - name: Patient-id
      path: /Patient/{id}
      operations:
      - name: getpatient
        method: GET
        description: Get Patient
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          description: FHIR Patient resource ID
          required: true
    authentication:
      type: bearer
      token: '{{env.VARIAN_MEDICAL_SYSTEMS_API_KEY}}'
  exposes:
  - type: rest
    namespace: varian-aria-fhir-patient-rest
    port: 8080
    description: REST adapter for Varian ARIA FHIR API — Patient. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/patient
      name: patient
      description: REST surface for Patient.
      operations:
      - method: GET
        name: searchpatients
        description: Search Patients
        call: varian-aria-fhir-patient.searchpatients
        with:
          _id: rest._id
          identifier: rest.identifier
          family: rest.family
          given: rest.given
          birthdate: rest.birthdate
          _count: rest._count
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/patient/{id}
      name: patient-id
      description: REST surface for Patient-id.
      operations:
      - method: GET
        name: getpatient
        description: Get Patient
        call: varian-aria-fhir-patient.getpatient
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: varian-aria-fhir-patient-mcp
    port: 9090
    transport: http
    description: MCP adapter for Varian ARIA FHIR API — Patient. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: search-patients
      description: Search Patients
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: varian-aria-fhir-patient.searchpatients
      with:
        _id: tools._id
        identifier: tools.identifier
        family: tools.family
        given: tools.given
        birthdate: tools.birthdate
        _count: tools._count
      outputParameters:
      - type: object
        mapping: $.
    - name: get-patient
      description: Get Patient
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: varian-aria-fhir-patient.getpatient
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
