naftiko: "1.0.0-alpha1"

info:
  label: "Varian ARIA FHIR API"
  description: >-
    Varian ARIA FHIR R4 API providing SMART on FHIR access to oncology clinical data
    from the ARIA Oncology Information System. Read-only access to patients, conditions,
    procedures, observations, diagnostic reports, care plans, and medications.
  tags:
    - Varian
    - Healthcare
    - Oncology
    - FHIR
    - Radiation Therapy
    - Interoperability
  created: "2026-05-03"
  modified: "2026-05-03"

binds:
  - namespace: env
    keys:
      VARIAN_FHIR_ACCESS_TOKEN: VARIAN_FHIR_ACCESS_TOKEN

capability:
  consumes:
    - type: http
      namespace: varian-fhir
      baseUri: https://varian.dynamicfhir.com/fhir/varian/basepractice/r4
      description: "Varian ARIA FHIR R4 clinical data API"
      authentication:
        type: bearer
        token: "{{VARIAN_FHIR_ACCESS_TOKEN}}"
      resources:
        - name: patients
          path: /Patient
          description: "Oncology patient demographics"
          operations:
            - name: search-patients
              method: GET
              description: "Search for oncology patients by name, MRN, or birth date"
              inputParameters:
                - name: identifier
                  in: query
                  type: string
                  required: false
                  description: "Patient MRN or identifier"
                - name: family
                  in: query
                  type: string
                  required: false
                  description: "Patient last name"
                - name: _count
                  in: query
                  type: integer
                  required: false
                  description: "Results per page"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: patient-detail
          path: /Patient/{id}
          description: "Individual patient resource"
          operations:
            - name: get-patient
              method: GET
              description: "Get a patient by FHIR resource ID"
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "FHIR Patient resource ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: conditions
          path: /Condition
          description: "Patient diagnoses and conditions"
          operations:
            - name: search-conditions
              method: GET
              description: "Search for patient conditions including cancer diagnoses"
              inputParameters:
                - name: patient
                  in: query
                  type: string
                  required: true
                  description: "Patient reference (e.g., Patient/12345678)"
                - name: code
                  in: query
                  type: string
                  required: false
                  description: "Condition code (ICD-10, SNOMED)"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: procedures
          path: /Procedure
          description: "Clinical procedures including radiation therapy"
          operations:
            - name: search-procedures
              method: GET
              description: "Search for procedures including radiation therapy treatments"
              inputParameters:
                - name: patient
                  in: query
                  type: string
                  required: true
                  description: "Patient reference"
                - name: date
                  in: query
                  type: string
                  required: false
                  description: "Procedure date"
                - name: status
                  in: query
                  type: string
                  required: false
                  description: "Procedure status"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: observations
          path: /Observation
          description: "Labs, vitals, and clinical measurements"
          operations:
            - name: search-observations
              method: GET
              description: "Search for clinical observations and lab results"
              inputParameters:
                - name: patient
                  in: query
                  type: string
                  required: true
                  description: "Patient reference"
                - name: code
                  in: query
                  type: string
                  required: false
                  description: "Observation LOINC code"
                - name: category
                  in: query
                  type: string
                  required: false
                  description: "Observation category"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: diagnostic-reports
          path: /DiagnosticReport
          description: "Pathology and imaging diagnostic reports"
          operations:
            - name: search-diagnostic-reports
              method: GET
              description: "Search for diagnostic reports including pathology results"
              inputParameters:
                - name: patient
                  in: query
                  type: string
                  required: true
                  description: "Patient reference"
                - name: date
                  in: query
                  type: string
                  required: false
                  description: "Report date"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: care-plans
          path: /CarePlan
          description: "Oncology treatment care plans"
          operations:
            - name: search-care-plans
              method: GET
              description: "Search for oncology care plans and treatment plans"
              inputParameters:
                - name: patient
                  in: query
                  type: string
                  required: true
                  description: "Patient reference"
                - name: status
                  in: query
                  type: string
                  required: false
                  description: "Care plan status"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: medication-requests
          path: /MedicationRequest
          description: "Chemotherapy and medication prescriptions"
          operations:
            - name: search-medication-requests
              method: GET
              description: "Search for medication orders including chemotherapy"
              inputParameters:
                - name: patient
                  in: query
                  type: string
                  required: true
                  description: "Patient reference"
                - name: status
                  in: query
                  type: string
                  required: false
                  description: "Medication request status"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: varian-fhir-rest
      resources:
        - path: /v1/patients
          name: patients
          description: "Patient demographics"
          operations:
            - method: GET
              name: search-patients
              description: "Search oncology patients"
              call: "varian-fhir.search-patients"
              with:
                identifier: "rest.identifier"
                family: "rest.family"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/conditions
          name: conditions
          description: "Patient diagnoses"
          operations:
            - method: GET
              name: search-conditions
              description: "Search patient conditions"
              call: "varian-fhir.search-conditions"
              with:
                patient: "rest.patient"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: varian-fhir-mcp
      transport: http
      tools:
        - name: search-patients
          description: "Search for oncology patients by name or MRN"
          hints:
            readOnly: true
            openWorld: false
          call: "varian-fhir.search-patients"
          with:
            identifier: "tools.identifier"
            family: "tools.family"
          outputParameters:
            - type: object
              mapping: "$."

        - name: get-patient
          description: "Get a patient by FHIR resource ID"
          hints:
            readOnly: true
            openWorld: false
          call: "varian-fhir.get-patient"
          with:
            id: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."

        - name: search-conditions
          description: "Search for a patient's cancer diagnoses and conditions"
          hints:
            readOnly: true
            openWorld: false
          call: "varian-fhir.search-conditions"
          with:
            patient: "tools.patient"
          outputParameters:
            - type: object
              mapping: "$."

        - name: search-procedures
          description: "Search for radiation therapy and other procedures for a patient"
          hints:
            readOnly: true
            openWorld: false
          call: "varian-fhir.search-procedures"
          with:
            patient: "tools.patient"
            date: "tools.date"
          outputParameters:
            - type: object
              mapping: "$."
