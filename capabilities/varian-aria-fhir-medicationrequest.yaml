naftiko: 1.0.0-alpha2
info:
  label: Varian ARIA FHIR API — MedicationRequest
  description: 'Varian ARIA FHIR API — MedicationRequest. 1 operations. Lead operation: Search Medication Requests. Self-contained
    Naftiko capability covering one Varian Medical Systems business surface.'
  tags:
  - Varian Medical Systems
  - MedicationRequest
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    VARIAN_MEDICAL_SYSTEMS_API_KEY: VARIAN_MEDICAL_SYSTEMS_API_KEY
capability:
  consumes:
  - type: http
    namespace: varian-aria-fhir-medicationrequest
    baseUri: https://varian.dynamicfhir.com/fhir/varian/basepractice/r4
    description: Varian ARIA FHIR API — MedicationRequest business capability. Self-contained, no shared references.
    resources:
    - name: MedicationRequest
      path: /MedicationRequest
      operations:
      - name: searchmedicationrequests
        method: GET
        description: Search Medication Requests
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: patient
          in: query
          type: string
          description: Patient reference
          required: true
        - name: status
          in: query
          type: string
          description: Medication request status
        - name: _count
          in: query
          type: integer
    authentication:
      type: bearer
      token: '{{env.VARIAN_MEDICAL_SYSTEMS_API_KEY}}'
  exposes:
  - type: rest
    namespace: varian-aria-fhir-medicationrequest-rest
    port: 8080
    description: REST adapter for Varian ARIA FHIR API — MedicationRequest. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/medicationrequest
      name: medicationrequest
      description: REST surface for MedicationRequest.
      operations:
      - method: GET
        name: searchmedicationrequests
        description: Search Medication Requests
        call: varian-aria-fhir-medicationrequest.searchmedicationrequests
        with:
          patient: rest.patient
          status: rest.status
          _count: rest._count
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: varian-aria-fhir-medicationrequest-mcp
    port: 9090
    transport: http
    description: MCP adapter for Varian ARIA FHIR API — MedicationRequest. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: search-medication-requests
      description: Search Medication Requests
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: varian-aria-fhir-medicationrequest.searchmedicationrequests
      with:
        patient: tools.patient
        status: tools.status
        _count: tools._count
      outputParameters:
      - type: object
        mapping: $.
