naftiko: 1.0.0-alpha2
info:
  label: Varian ARIA FHIR API — DocumentReference
  description: 'Varian ARIA FHIR API — DocumentReference. 1 operations. Lead operation: Search Document References. Self-contained
    Naftiko capability covering one Varian Medical Systems business surface.'
  tags:
  - Varian Medical Systems
  - DocumentReference
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    VARIAN_MEDICAL_SYSTEMS_API_KEY: VARIAN_MEDICAL_SYSTEMS_API_KEY
capability:
  consumes:
  - type: http
    namespace: varian-aria-fhir-documentreference
    baseUri: https://varian.dynamicfhir.com/fhir/varian/basepractice/r4
    description: Varian ARIA FHIR API — DocumentReference business capability. Self-contained, no shared references.
    resources:
    - name: DocumentReference
      path: /DocumentReference
      operations:
      - name: searchdocumentreferences
        method: GET
        description: Search Document References
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: patient
          in: query
          type: string
          description: Patient reference
          required: true
        - name: type
          in: query
          type: string
          description: Document type code (LOINC)
        - name: _count
          in: query
          type: integer
    authentication:
      type: bearer
      token: '{{env.VARIAN_MEDICAL_SYSTEMS_API_KEY}}'
  exposes:
  - type: rest
    namespace: varian-aria-fhir-documentreference-rest
    port: 8080
    description: REST adapter for Varian ARIA FHIR API — DocumentReference. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/documentreference
      name: documentreference
      description: REST surface for DocumentReference.
      operations:
      - method: GET
        name: searchdocumentreferences
        description: Search Document References
        call: varian-aria-fhir-documentreference.searchdocumentreferences
        with:
          patient: rest.patient
          type: rest.type
          _count: rest._count
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: varian-aria-fhir-documentreference-mcp
    port: 9090
    transport: http
    description: MCP adapter for Varian ARIA FHIR API — DocumentReference. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: search-document-references
      description: Search Document References
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: varian-aria-fhir-documentreference.searchdocumentreferences
      with:
        patient: tools.patient
        type: tools.type
        _count: tools._count
      outputParameters:
      - type: object
        mapping: $.
