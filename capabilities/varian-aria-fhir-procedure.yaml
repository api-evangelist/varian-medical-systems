naftiko: 1.0.0-alpha2
info:
  label: Varian ARIA FHIR API — Procedure
  description: 'Varian ARIA FHIR API — Procedure. 2 operations. Lead operation: Search Procedures. Self-contained Naftiko
    capability covering one Varian Medical Systems business surface.'
  tags:
  - Varian Medical Systems
  - Procedure
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    VARIAN_MEDICAL_SYSTEMS_API_KEY: VARIAN_MEDICAL_SYSTEMS_API_KEY
capability:
  consumes:
  - type: http
    namespace: varian-aria-fhir-procedure
    baseUri: https://varian.dynamicfhir.com/fhir/varian/basepractice/r4
    description: Varian ARIA FHIR API — Procedure business capability. Self-contained, no shared references.
    resources:
    - name: Procedure
      path: /Procedure
      operations:
      - name: searchprocedures
        method: GET
        description: Search Procedures
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: patient
          in: query
          type: string
          description: Patient reference
          required: true
        - name: code
          in: query
          type: string
          description: Procedure code (CPT, SNOMED CT)
        - name: date
          in: query
          type: string
          description: Procedure date (YYYY-MM-DD or date range)
        - name: status
          in: query
          type: string
          description: Procedure status
        - name: _count
          in: query
          type: integer
    - name: Procedure-id
      path: /Procedure/{id}
      operations:
      - name: getprocedure
        method: GET
        description: Get Procedure
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.VARIAN_MEDICAL_SYSTEMS_API_KEY}}'
  exposes:
  - type: rest
    namespace: varian-aria-fhir-procedure-rest
    port: 8080
    description: REST adapter for Varian ARIA FHIR API — Procedure. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/procedure
      name: procedure
      description: REST surface for Procedure.
      operations:
      - method: GET
        name: searchprocedures
        description: Search Procedures
        call: varian-aria-fhir-procedure.searchprocedures
        with:
          patient: rest.patient
          code: rest.code
          date: rest.date
          status: rest.status
          _count: rest._count
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/procedure/{id}
      name: procedure-id
      description: REST surface for Procedure-id.
      operations:
      - method: GET
        name: getprocedure
        description: Get Procedure
        call: varian-aria-fhir-procedure.getprocedure
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: varian-aria-fhir-procedure-mcp
    port: 9090
    transport: http
    description: MCP adapter for Varian ARIA FHIR API — Procedure. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: search-procedures
      description: Search Procedures
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: varian-aria-fhir-procedure.searchprocedures
      with:
        patient: tools.patient
        code: tools.code
        date: tools.date
        status: tools.status
        _count: tools._count
      outputParameters:
      - type: object
        mapping: $.
    - name: get-procedure
      description: Get Procedure
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: varian-aria-fhir-procedure.getprocedure
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
