naftiko: 1.0.0-alpha2
info:
  label: Varian ARIA FHIR API — Goal
  description: 'Varian ARIA FHIR API — Goal. 1 operations. Lead operation: Search Goals. Self-contained Naftiko capability
    covering one Varian Medical Systems business surface.'
  tags:
  - Varian Medical Systems
  - Goal
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    VARIAN_MEDICAL_SYSTEMS_API_KEY: VARIAN_MEDICAL_SYSTEMS_API_KEY
capability:
  consumes:
  - type: http
    namespace: varian-aria-fhir-goal
    baseUri: https://varian.dynamicfhir.com/fhir/varian/basepractice/r4
    description: Varian ARIA FHIR API — Goal business capability. Self-contained, no shared references.
    resources:
    - name: Goal
      path: /Goal
      operations:
      - name: searchgoals
        method: GET
        description: Search Goals
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: patient
          in: query
          type: string
          description: Patient reference
          required: true
        - name: lifecycle-status
          in: query
          type: string
          description: Goal lifecycle status
        - name: _count
          in: query
          type: integer
    authentication:
      type: bearer
      token: '{{env.VARIAN_MEDICAL_SYSTEMS_API_KEY}}'
  exposes:
  - type: rest
    namespace: varian-aria-fhir-goal-rest
    port: 8080
    description: REST adapter for Varian ARIA FHIR API — Goal. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/goal
      name: goal
      description: REST surface for Goal.
      operations:
      - method: GET
        name: searchgoals
        description: Search Goals
        call: varian-aria-fhir-goal.searchgoals
        with:
          patient: rest.patient
          lifecycle-status: rest.lifecycle-status
          _count: rest._count
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: varian-aria-fhir-goal-mcp
    port: 9090
    transport: http
    description: MCP adapter for Varian ARIA FHIR API — Goal. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: search-goals
      description: Search Goals
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: varian-aria-fhir-goal.searchgoals
      with:
        patient: tools.patient
        lifecycle-status: tools.lifecycle-status
        _count: tools._count
      outputParameters:
      - type: object
        mapping: $.
