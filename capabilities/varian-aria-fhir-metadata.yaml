naftiko: 1.0.0-alpha2
info:
  label: Varian ARIA FHIR API — Metadata
  description: 'Varian ARIA FHIR API — Metadata. 1 operations. Lead operation: Get Capability Statement. Self-contained Naftiko
    capability covering one Varian Medical Systems business surface.'
  tags:
  - Varian Medical Systems
  - Metadata
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    VARIAN_MEDICAL_SYSTEMS_API_KEY: VARIAN_MEDICAL_SYSTEMS_API_KEY
capability:
  consumes:
  - type: http
    namespace: varian-aria-fhir-metadata
    baseUri: https://varian.dynamicfhir.com/fhir/varian/basepractice/r4
    description: Varian ARIA FHIR API — Metadata business capability. Self-contained, no shared references.
    resources:
    - name: metadata
      path: /metadata
      operations:
      - name: getcapabilitystatement
        method: GET
        description: Get Capability Statement
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.VARIAN_MEDICAL_SYSTEMS_API_KEY}}'
  exposes:
  - type: rest
    namespace: varian-aria-fhir-metadata-rest
    port: 8080
    description: REST adapter for Varian ARIA FHIR API — Metadata. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/metadata
      name: metadata
      description: REST surface for metadata.
      operations:
      - method: GET
        name: getcapabilitystatement
        description: Get Capability Statement
        call: varian-aria-fhir-metadata.getcapabilitystatement
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: varian-aria-fhir-metadata-mcp
    port: 9090
    transport: http
    description: MCP adapter for Varian ARIA FHIR API — Metadata. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: get-capability-statement
      description: Get Capability Statement
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: varian-aria-fhir-metadata.getcapabilitystatement
      outputParameters:
      - type: object
        mapping: $.
