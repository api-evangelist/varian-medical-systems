naftiko: 1.0.0-alpha2
info:
  label: Varian ARIA FHIR API — Condition
  description: 'Varian ARIA FHIR API — Condition. 2 operations. Lead operation: Search Conditions. Self-contained Naftiko
    capability covering one Varian Medical Systems business surface.'
  tags:
  - Varian Medical Systems
  - Condition
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    VARIAN_MEDICAL_SYSTEMS_API_KEY: VARIAN_MEDICAL_SYSTEMS_API_KEY
capability:
  consumes:
  - type: http
    namespace: varian-aria-fhir-condition
    baseUri: https://varian.dynamicfhir.com/fhir/varian/basepractice/r4
    description: Varian ARIA FHIR API — Condition business capability. Self-contained, no shared references.
    resources:
    - name: Condition
      path: /Condition
      operations:
      - name: searchconditions
        method: GET
        description: Search Conditions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: patient
          in: query
          type: string
          description: Patient reference (e.g., Patient/12345678)
          required: true
        - name: code
          in: query
          type: string
          description: Condition code (ICD-10, SNOMED CT)
        - name: category
          in: query
          type: string
          description: Condition category
        - name: _count
          in: query
          type: integer
          description: Maximum number of results
    - name: Condition-id
      path: /Condition/{id}
      operations:
      - name: getcondition
        method: GET
        description: Get Condition
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.VARIAN_MEDICAL_SYSTEMS_API_KEY}}'
  exposes:
  - type: rest
    namespace: varian-aria-fhir-condition-rest
    port: 8080
    description: REST adapter for Varian ARIA FHIR API — Condition. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/condition
      name: condition
      description: REST surface for Condition.
      operations:
      - method: GET
        name: searchconditions
        description: Search Conditions
        call: varian-aria-fhir-condition.searchconditions
        with:
          patient: rest.patient
          code: rest.code
          category: rest.category
          _count: rest._count
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/condition/{id}
      name: condition-id
      description: REST surface for Condition-id.
      operations:
      - method: GET
        name: getcondition
        description: Get Condition
        call: varian-aria-fhir-condition.getcondition
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: varian-aria-fhir-condition-mcp
    port: 9090
    transport: http
    description: MCP adapter for Varian ARIA FHIR API — Condition. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: search-conditions
      description: Search Conditions
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: varian-aria-fhir-condition.searchconditions
      with:
        patient: tools.patient
        code: tools.code
        category: tools.category
        _count: tools._count
      outputParameters:
      - type: object
        mapping: $.
    - name: get-condition
      description: Get Condition
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: varian-aria-fhir-condition.getcondition
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
