description: Varian does not publish public API rate limits. Throughput and concurrency are governed by the Developer Program agreement and the on-premises Aria/Eclipse deployment characteristics at the customer site.
sources:
  - https://cancercare.siemens-healthineers.com/
notes: No public rate-limit documentation. Limits are governed by site-specific deployment characteristics and the Developer Program contract; consumers must obtain operational specifics from the customer's Varian contact.
responseCodes:
  throttled: 429
limits:
  - name: Customer-Site / Partner-Contracted Limit
    scope: account
    metric: varies
    limit: see customer/site agreement
policies:
  - name: Site-Specific Deployment
    description: Varian Aria/Eclipse APIs run inside customer hospital networks; throughput depends on the on-prem hardware and the integration partner agreement, not a SaaS rate limit.
  - name: Developer Program Governs
    description: Operational guarantees, error handling expectations, and supported call patterns are defined in the Varian Developer Program documentation provided to approved partners.
